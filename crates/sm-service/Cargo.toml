[package]
name = "sm-service"
version = "0.1.0"
edition.workspace = true
description = "业务逻辑层，对应 Python 的 114 个 service 文件"

[dependencies]
sm-core = { workspace = true }
# 运行期读写配置文件（ConfigService 的原子写盘与重读磁盘快照）
toml = { workspace = true }
sm-db = { workspace = true }
# 刻意**不**依赖 sm-plugins：源码里没有任何 `sm_plugins::` 引用，而这一行
# 会把依赖方向锁死 —— 插件任务要接 cron 触发，需要 `sm-plugins → sm-scheduler
# → sm-service → sm-plugins` 不成环。等 service 层真要调插件时再按那时的
# 分层加回来（ADR §6：不使用的依赖声明就是幽灵配置）。
media-file-hash = { workspace = true }
svc-hash = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `discovery::qdrant` 的 upsert 重试要用 `tokio::time::sleep` 做退避。
tokio = { workspace = true }
reqwest = { workspace = true }
# discovery 域的向量库存储层。Qdrant 走 gRPC，与插件 ABI 共用同一套 tonic/prost。
qdrant-client = { workspace = true }
url = { workspace = true }
regex = { workspace = true }
sqlx = { workspace = true }
# Torznab 搜索响应是 XML。
quick-xml = { workspace = true }

[dev-dependencies]
sm-db = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bcrypt = { workspace = true }
sqlx = { workspace = true }
# 集成测试（tests/）只链接 dev-dependencies，拿不到普通依赖里的 reqwest。
# `embedding_http.rs` 要用 `reqwest::Client::builder().no_proxy()` 构造注入的
# 客户端 —— no_proxy 是契约的一部分（见 TorznabClient 同款理由），不能省。
reqwest = { workspace = true }
# Torznab 的 HTTP 路径用假 indexer 起真实回环服务测（ADR §6）。
wiremock = "0.6"
