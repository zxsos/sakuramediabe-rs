[workspace]
resolver = "2"
members = [
    "crates/hashing",
    "crates/media-file-hash",
    "crates/svc-hash",
    "crates/svc-image",
    "crates/parity-cli",
    "crates/plugin-ref-local",
    "crates/sm-core",
    "crates/sm-db",
    "crates/sm-plugin-api",
    "crates/sm-plugins",
    "crates/sm-service",
    "crates/sm-api",
    "crates/sm-scheduler",
    "crates/sm-server",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
hashing = { path = "crates/hashing" }
media-file-hash = { path = "crates/media-file-hash" }
svc-hash = { path = "crates/svc-hash" }
plugin-ref-local = { path = "crates/plugin-ref-local" }
sm-core = { path = "crates/sm-core" }
sm-db = { path = "crates/sm-db" }
sm-plugin-api = { path = "crates/sm-plugin-api" }
sm-plugins = { path = "crates/sm-plugins" }
sm-service = { path = "crates/sm-service" }
sm-api = { path = "crates/sm-api" }
sm-scheduler = { path = "crates/sm-scheduler" }

# 契约层：客户端是 Flutter，API 契约必须逐字节不变
# 126 端点 / 156 DTO / 80 枚举 / SSE 13 事件 / 错误信封 {error:{code,message,details}}
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 异步运行时（替代 asyncio + uvicorn）
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# HTTP 服务（替代 FastAPI / starlette）
# multipart：上传（插件 zip / 图片）。提取器在 sm-api::extract，
# 对齐上游 FastAPI 的 `UploadFile = File(...)`。
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
# 读取响应体（集成测试断言用）
http-body-util = "0.1"

# 数据库（替代 Peewee 4.5）：schema 完全保留，只做查询不引迁移框架
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "json", "chrono", "uuid"] }

# gRPC 插件 ABI（替代进程内 Python import）
tonic = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"

# HTTP 客户端（替代 httpx）
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }

# 时间与标识
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# 认证（替代 python-jose + bcrypt）
#
# JWT 是 sm-core 自实现的 HS256（见 crates/sm-core/src/jwt.rs），
# **不引入 jsonwebtoken**：上游 payload 只有 sub/type/exp 三个 claim，
# 引入一个完整 JOSE 实现换不来对等的收益，反而多一份要审计的密码学代码。
argon2 = "0.6"
# 只用于**验证**存量 bcrypt 哈希（迁移路径），写侧仍是 Argon2id。
# 纯 Rust：blowfish 由 cipher 实现，交叉编译与离线 NAS 构建不受影响。
bcrypt = "0.19"
# `getrandom` 而非 `rand_core`：password-hash 0.6 的 `rand_core` 指向 rand_core 0.10，
# 该版本不再提供 `OsRng`（已迁到 `rand` crate），手动造盐的那条路走不通。
# 开 `getrandom` 后 `PasswordHasher::hash_password` 自带随机盐，语义等价且更短。
password-hash = { version = "0.6", features = ["getrandom"] }
rand = "0.8"

# 调度（替代 APScheduler）
# ADR §2/§3.1：`tokio-cron-scheduler` 自带 job store 与执行器，会与 DB 持久
# 队列形成两套状态源，已被 `cron` + 自研 tick 取代（见 crates/sm-scheduler）。
# 这里只留表达式解析：到点判定在 tick，领取与租约在 worker。
#
# ADR §6 还列了 `tokio-util` 与 `tracing-appender`：前者**故意不加** ——
# SSE 用 axum 自带的 `response::sse::{Event,Sse,KeepAlive}`，优雅关闭用
# `axum::serve(...).with_graceful_shutdown(...)`，两处都不需要它，而不使用的
# 依赖声明就是 ADR §6 所说的幽灵配置。
cron = "0.17"
# 日志落盘（替代 logging.handlers.RotatingFileHandler），仅 release 组合根启用
tracing-appender = "0.2"

# 配置（替代 pydantic-settings + toml）
#
# 刻意**不**用 `config` crate：它给的是「扁平键 + 环境变量覆盖」，而本仓库要的
# 恰恰是「按 sm_core::config_schema 的 `节.字段` 结构读」，默认值的唯一来源是
# 那张模式表。环境变量那层由 sm-server::config 自己处理（键名是既有部署契约，
# 不能动）。曾用过它，代价是 `database.url` 的默认值出现了第二份字面量，且已经
# 与上游漂移（`/sakuramedia` vs `/sakuramediabe`）。
# toml：与上面那个**不是**重复依赖，分工不同。
#   - `config` 在**进程启动**时读配置，要支持环境变量覆盖（上游
#     pydantic-settings 的 env 优先级），只有它做得到；
#   - `toml` 在**运行期**读写配置文件（`ConfigService::update` 的原子写盘
#     与「每次 PATCH 重读磁盘快照」），这里要的是精确控制序列化形状 ——
#     `config` 是只读库，且 `to_string_pretty` 的输出会被运维直接阅读。
# 要合并成一个的话，得给 `config` 加写回能力，那是它刻意不提供的方向。
toml = "0.9"

# 编码与解析（替代 Python 内建）
base64 = "0.23"
percent-encoding = "2"
url = "2"
regex = "1"
# XML（Torznab 搜索响应）。替代上游的 xmltodict。
quick-xml = "0.42"

# 图像（替代 Pillow + OpenCV）
#
# `default-features = false` 是硬要求：默认特性 = rayon + default-formats，
# 而 default-formats 里的 avif 会拖进 ravif/rgb -> dav1d（AV1 解码的 C 绑定），
# 与「纯 Rust、NAS 离线可编」冲突。只开实际用到的三种格式：
#   jpeg -> zune-jpeg（纯 Rust）  png -> png（纯 Rust）  webp -> image-webp（纯 Rust）
# 封面书脊检测的 Sobel 是自写的（crates/svc-image），不引 imageproc ——
# 后者会拖进 nalgebra / rayon / rustdct，为 40 行卷积不值得。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# 服务端二进制不需要 unwind：panic 即进程退出，由 supervisor 重启。
# 只作用于 release，`cargo test`（dev profile）仍是 unwind，不受影响。
panic = "abort"
