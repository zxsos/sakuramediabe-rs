[package]
name = "plugin-judge-collection"
version = "0.1.0"
description = "合集判定插件：按时长/番号特征/标签自动标记合集影片的 Rust 实现"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

# 独立仓库：不继承 workspace 的 lint 表，就地写死。
[lints.rust]
unsafe_code = "forbid"

[dependencies]
# 契约只剩这一个后端依赖 —— 本仓库不依赖宿主实现。
#
# 契约仓在 **GitHub**（`zxsos/sakuramedia-plugin-api`），按 **tag** 依赖而不是
# branch：按 branch 会让本插件与宿主静默漂移到不同版本的契约，症状是注册不上
# 而不报错。
#
# tag 必须与宿主的 `ABI_MAJOR` 配套：宿主现为 2，所以用 v0.2.0。
sm-plugin-api = { git = "https://github.com/zxsos/sakuramedia-plugin-api.git", tag = "v0.2.0" }

tonic = "0.14"
# BoxStream：RunJob 的流式返回类型被生成代码固定成它。
futures = "0.3"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
# net：起真实 server 要 TcpListenerStream。
tokio-stream = { version = "0.1", features = ["net"] }
# 读宿主写好的配置文件（SAKURAMEDIA_PLUGIN_SETTINGS_FILE）。
serde_json = "1"
# protobuf Struct/Value 构造（终态 result、patch 字段）。
prost-types = "0.14"

# 插件的**可执行文件**：宿主按 `<root_dir>/<plugin_id>/<plugin_id>` 找它。
# plugin_id 沿用上游（含 `collecttion` 拼写），见 src/lib.rs 的 PLUGIN_ID。
[[bin]]
name = "sakuramedia_judge_collecttion_movie"
path = "src/bin/sakuramedia_judge_collecttion_movie.rs"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
