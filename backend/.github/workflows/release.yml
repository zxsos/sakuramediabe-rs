name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Build release
        run: cargo build --release --bin sm-server
      
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sm-server-linux-x86_64
          path: target/release/sm-server
          retention-days: 7

  build-musl:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release (musl)
        run: cargo build --release --target x86_64-unknown-linux-musl --bin sm-server

      - name: Upload musl binary
        uses: actions/upload-artifact@v4
        with:
          name: sm-server-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/sm-server
          retention-days: 7
