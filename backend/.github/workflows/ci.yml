name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 定期重跑是为了发现「上游自己改了模型」——本仓库的 push 触发不了这种漂移。
  schedule:
    # 每周一 03:17 UTC。上游是个人项目，周更节奏比日更现实。
    - cron: '17 3 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-build:
    name: rust / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets

  rust-test:
    name: rust / test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - sm-core
          - sm-db
          - sm-api
          - sm-service
          - sm-plugins
          - sm-scheduler
          - sm-server
          - sm-plugin-api
          - hashing
          - media-file-hash
          - svc-hash
          - svc-image
          - svc-probe
          - plugin-ref-local
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test ${{ matrix.crate }}
        # `--lib` 是刻意的：集成测试需要真实的 PostgreSQL，而本 job 没有
        # 那个 service。带 integration suite 的话，`TestDb::require()` 会
        # 因为连不上库而 panic —— 那是**正确**的行为（静默跳过会让「跳过」
        # 与「通过」在报告里无法区分），但它会让这个 job 变得毫无意义。
        #
        # 集成测试全部由下面的 `integration` job 跑，那里**跑全部 8 个
        # suite**，不再只挑两个。
        run: cargo test -p ${{ matrix.crate }} --lib

  rust-fmt:
    name: rust / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check

  rust-clippy:
    name: rust / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-doc:
    name: rust / doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 文档里的类型链接是**活的引用**，写错不会让编译失败、也不会让
      # clippy 失败，只在 cargo doc 时报 warning。而坏链接意味着读者
      # 点不开他去查的那个类型 —— 在这个项目里那正是最常需要的动作。
      #
      # -D warnings 让未解析链接、指向私有项的链接、以及 `sqlx::query_as`
      # 这类「函数与宏同名」的歧义都变成硬错误。
      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  # 集成测试需要一个真实的 PostgreSQL。
  #
  # 单独一个 job 而不是给上面的 rust 加 service：那里的 `cargo test --lib`
  # 不依赖数据库，而集成测试在无 DATABASE_URL 时会**失败**（`TestDb::require`
  # 直接 panic）。混在一起会让那个 job 变成纯噪声。
  #
  # 容器必须设 timezone=UTC：列是 `timestamp without time zone`，容器时区
  # 不是 UTC 会让 naive datetime 的往返比较出现偏移。
  integration:
    name: rust / integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sakuramedia
          POSTGRES_PASSWORD: sakuramedia
          POSTGRES_DB: sakuramedia_test
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sakuramedia -d sakuramedia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 必须是 127.0.0.1 而不是 localhost：runner 上 localhost 先解析到 ::1，
      # 而 service 的端口映射只监听 IPv4，会报
      # "fe_sendauth: no password supplied"（连的其实是另一个 listener）。
      SMDB_TEST_DATABASE_URL: postgres://sakuramedia:sakuramedia@127.0.0.1:5433/sakuramedia_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Apply generated DDL
        # DDL 由 parity/gen_ddl.py 从上游 Peewee 模型生成，CI 里重新生成而不是
        # 用仓库里那份 —— 免得有人手改 schema.sql 却没改生成器。
        #
        # search_path 必须和 DDL 在**同一次连接**里生效：`psql -c 'SET search_path'`
        # 与 `psql -f` 是两个独立会话，SET 不会带过去，40 张表会落进 public。
        # 所以把 SET 与 DDL 拼成一个文件一次喂进去。
        run: |
          python3 parity/gen_ddl.py --out /tmp/schema.sql
          {
            echo "DROP SCHEMA IF EXISTS sakuramedia_test CASCADE;"
            echo "CREATE SCHEMA sakuramedia_test;"
            echo "SET search_path TO sakuramedia_test;"
            cat /tmp/schema.sql
          } > /tmp/apply.sql
          PGPASSWORD=sakuramedia psql -v ON_ERROR_STOP=1 \
               -h 127.0.0.1 -p 5433 -U sakuramedia -d sakuramedia_test \
               -f /tmp/apply.sql
          # 确认表真的落在目标 schema 里，而不是 public —— 上面那个坑的回归防线。
          PGPASSWORD=sakuramedia psql -v ON_ERROR_STOP=1 -t \
               -h 127.0.0.1 -p 5433 -U sakuramedia -d sakuramedia_test \
               -c "SELECT count(*) FROM information_schema.tables
                   WHERE table_schema='sakuramedia_test';"

      - name: Integration tests
        # 全部 8 个 suite。**不是**只挑几个。
        #
        # 此前这里只跑 `repo_integration` 与 `gateway_integration`，另外 6 个
        # suite（99 个测试）编译但从不执行。它们长期藏着真实缺陷 ——
        # NOT NULL 违例、缺失的外键父行、不存在的列名、占位符编号错、
        # 单连接池下靠 `Drop` 回滚导致的死锁。每一条都是在 suite 第一次
        # 真正执行时才暴露的。
        #
        # `--test-threads=8` 不是性能取舍，是**正确性**要求：每个测试的
        # `TestDb` 自建一个连接池，析构时还要另建一条连接做清理，所以
        # 峰值连接数约为并行度的两倍。不限制时本机（多核）峰值超过 100，
        # 撞上 PostgreSQL 的 `max_connections` 上限 —— 表现是大量测试报
        # 「连不上库」，以及**整个数据库进程被拖垮**。
        #
        # 8 × 2 = 16 条连接，远低于容器默认上限，且不依赖 runner 的核数。
        run: |
          set -o pipefail
          cargo test -p sm-db --tests -- --test-threads=8 2>&1 | tee /tmp/integration.log

      - name: Verify every suite actually ran
        # 逐个 suite 断言它的名字出现在日志里。
        #
        # 此前是 `grep -q "31 passed"` 那类断言，两个问题：任一 suite 单独
        # 匹配上就会放行；而且写死通过数会在每次增删测试时误报 —— 它本来防
        # 的事情（整体跳过）现在由 `TestDb::require()` 的 panic 兜住了。
        #
        # 数 `test result:` 行也不对：`--tests` 会把 lib 的单元测试也算进去
        # （9 行 vs 8 个 suite）。所以按名字逐个确认。
        run: |
          fail=0
          for suite in actor gateway media_family multi_table p0 pagination repo unit_of_work; do
            if ! grep -q "$suite" /tmp/integration.log; then
              echo "::error::suite '$suite' produced no output -- it was skipped or aborted"
              fail=1
            fi
          done
          echo "--- per-suite ---"
          grep -E '^(     Running|test result:)' /tmp/integration.log || true
          if grep -q 'SKIP: 未设置' /tmp/integration.log; then
            echo "::error::a suite skipped for want of a database"
            fail=1
          fi
          if grep -q 'test result: FAILED' /tmp/integration.log; then
            echo "::error::at least one suite failed"
            fail=1
          fi
          exit $fail

  # 与上游 Peewee 模型逐字段比对。这是本仓库与上游之间唯一的自动防线：
  # 40 张表的列名、类型、可空性一旦漂移，本仓库的读路径就会静默拿不到值。
  schema-parity:
    name: parity / schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 上游 pyproject 要求 >=3.10,<3.11。契约解析只用 ast，但对齐上游
          # 解释器版本能避免语法边界的意外差异。
          python-version: '3.10'

      - name: Checkout upstream backend
        run: |
          # 只取最新一次提交：契约比对只关心模型的当前形状，不关心历史。
          git clone --depth 1 https://github.com/tinypinglite/sakuramediabe.git /tmp/backend
          echo "upstream model files: $(find /tmp/backend/src/model -name '*.py' | wc -l)"

      - name: Schema contract parity
        env:
          PEEWEE_ROOT: /tmp/backend/src/model
          SM_DB_SRC: ${{ github.workspace }}/crates/sm-db/src
        run: |
          # 失败意味着列名、类型或可空性发生了漂移。
          python parity/compare_schema.py

      - name: Dump contract
        if: always()
        run: |
          PEEWEE_ROOT=/tmp/backend/src/model python parity/schema_contract.py \
            --out contract.json
          cat contract.json

  # Rust 与 Python 双跑，逐条比对算法结果。
  algo-parity:
    name: parity / algorithms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build parity binaries
        run: |
          # 两个二进制对应两个对拍脚本，缺一不可：
          #   parity-cli   -> compare.py       (media-file-hash)
          #   core_parity  -> compare_core.py  (错误信封/分页/认证 DTO)
          #
          # 必须是两条独立命令：`--bin core_parity` 会把选择器限定到那个
          # 二进制，写成 `-p parity-cli -p sm-core --bin core_parity` 时
          # parity-cli 会被静默跳过，然后下一步 ls 才报「文件不存在」。
          cargo build --release -p parity-cli
          cargo build --release -p sm-core --bin core_parity

      - name: Locate binaries
        run: |
          ls -l target/release/parity-cli target/release/core_parity


      - name: Regenerate bencode fixtures
        run: python parity/gen_bencode_fixtures.py

      - name: "Parity: media-file-hash"
        run: python parity/compare.py

      - name: "Parity: core primitives"
        run: python parity/compare_core.py
