[package]
name = "plugin-actor-metadata"
version = "0.1.0"
description = "SakuraMedia 女优资料补全插件：从 JavDB / MinnanoAV 补全演员资料（进程内版本）"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sm-plugin-api = { workspace = true }
tonic = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
prost-types = { workspace = true }
chrono = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
md-5 = "0.10"
unicode-normalization = "0.1"

# 可执行文件：宿主按 `<root_dir>/<plugin_id>/<plugin_id>` 拉起的那个进程
# （见 docs/adr/2026-10-05-plugin-lifecycle.md）。
[[bin]]
name = "sakuramedia_actor_metadata"
path = "src/bin/sakuramedia_actor_metadata.rs"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
