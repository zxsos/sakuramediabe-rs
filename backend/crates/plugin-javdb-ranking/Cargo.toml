[package]
name = "plugin-javdb-ranking"
version = "0.1.2"
description = "JavDB 排行榜插件：discovery.ranking_source 扩展点（进程内版本）"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sm-plugin-api = { workspace = true }
tonic = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
# 本插件不自己出网：榜单番号由宿主的 `GetJavdbRankNumbers` 取，所以没有
# reqwest / url（详见 lib.rs 的模块文档）。
serde_json = { workspace = true }
serde = { workspace = true }
# `RunJobRequest.params` / `JobEvent.result` 的载荷类型（手写 params schema 也用）。
prost-types = { workspace = true }
# TOP250 的年份周期要算「当前年」（上游 `datetime.now().astimezone().year`）。
chrono = { workspace = true }
