[package]
name = "sm-plugin-api"
version = "0.1.0"
description = "SakuraMedia 插件 gRPC 契约（prost/tonic 生成）+ 插件侧默认实现层"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

# 独立仓库，**不能**出现 `*.workspace = true`：本 crate 所在的 workspace
# 就是本仓库根，继承字段在下游依赖者手里会解析失败。
# 见原仓库 docs/plugin-api-split.md「拆的时候必须改的两处」。
[lints.rust]
unsafe_code = "forbid"

[dependencies]
# 契约层被宿主与所有插件共用，这里的每一条都会成为下游的最小依赖集。
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
# vendored protoc：换环境的 CI 与离线 NAS 都不必另装 protoc。
protoc-bin-vendored = "3"
# 默认实现层把流式 rpc 的关联类型固定为 `BoxStream`（见 src/provider.rs）。
futures = "0.3"
# 交付校验要判 `release_date` 是不是严格的 YYYY-MM-DD（proto 写在字段上的原话），
# 以及清理失败时记 warn。这两样跟着校验规则一起住在契约仓 —— 规则搬走、
# 依赖留下会让下一次搬迁漏掉一半。
#
# 版本与宿主仓 `[workspace.dependencies]` 保持一致（契约层被两侧共用，
# 版本漂移会让插件的依赖树与宿主不同）。
chrono = { version = "0.4", features = ["serde"] }
# `json_struct`：宿主侧是 `serde_json::Value`、插件侧是 `google.protobuf.Struct`，
# 互转规则只有一份，放在契约仓（见 src/json_struct.rs）。
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"

[dev-dependencies]
# 默认实现层的单测要直接 await 生成的 server trait。
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
